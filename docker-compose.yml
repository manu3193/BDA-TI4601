# TI-4601 — orquestación declarativa
#
# Perfiles:
#   (ninguno)  postgres          → Semanas 2–4 + lab concurrencia
#   lab1       cockroachdb ×3    → Lab 1 (S5) y P1 (S5–S8)
#   lab2       valkey (clave-valor) → Laboratorio 2 (S9)
#   lab3       mongodb ×3 (conjunto de réplicas) → Laboratorio 3 (S10) y base del P2
#   lab4       neo4j ×1 + notebook             → Laboratorio 4 (S13), actas municipales
#
# Cliente Python: siempre vía `docker compose run --rm app …`
# (Compose habilita el perfil del servicio target automáticamente).

name: ti4601

services:
  postgres:
    image: postgres:16
    container_name: ti4601-postgres
    environment:
      POSTGRES_USER: ti4601
      POSTGRES_PASSWORD: ti4601
      POSTGRES_DB: ti4601
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ti4601 -d ti4601"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks:
      - curso

  valkey:
    image: valkey/valkey:8.1
    profiles: ["lab2"]
    container_name: ti4601-valkey
    command: >
      valkey-server --save "" --appendonly no
      --maxmemory 4gb --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks:
      - curso

  app:
    build: .
    image: ti4601:local
    working_dir: /src
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ti4601
      PGPASSWORD: ti4601
      PGDATABASE: ti4601
      TI4601_ENGINE: postgres
      VALKEY_HOST: valkey
    volumes:
      - .:/src
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - curso
    profiles: ["client"]

  crdb-1:
    image: cockroachdb/cockroach:v24.3.0
    profiles: ["lab1"]
    container_name: ti4601-crdb-1
    hostname: crdb-1
    command: start --insecure --advertise-addr=crdb-1 --join=crdb-1,crdb-2,crdb-3 --locality=region=cr-sj,zone=a --cache=256MiB --max-sql-memory=256MiB
    volumes:
      - crdb1:/cockroach/cockroach-data
    ports:
      - "127.0.0.1:26257:26257"
      - "127.0.0.1:8080:8080"
    networks:
      - curso

  crdb-2:
    image: cockroachdb/cockroach:v24.3.0
    profiles: ["lab1"]
    container_name: ti4601-crdb-2
    hostname: crdb-2
    command: start --insecure --advertise-addr=crdb-2 --join=crdb-1,crdb-2,crdb-3 --locality=region=cr-limon,zone=a --cache=256MiB --max-sql-memory=256MiB
    volumes:
      - crdb2:/cockroach/cockroach-data
    networks:
      - curso

  crdb-3:
    image: cockroachdb/cockroach:v24.3.0
    profiles: ["lab1"]
    container_name: ti4601-crdb-3
    hostname: crdb-3
    command: start --insecure --advertise-addr=crdb-3 --join=crdb-1,crdb-2,crdb-3 --locality=region=us-east,zone=a --cache=256MiB --max-sql-memory=256MiB
    volumes:
      - crdb3:/cockroach/cockroach-data
    networks:
      - curso

  crdb-init:
    image: cockroachdb/cockroach:v24.3.0
    profiles: ["lab1"]
    container_name: ti4601-crdb-init
    depends_on:
      - crdb-1
      - crdb-2
      - crdb-3
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        for i in $$(seq 1 90); do
          if cockroach init --insecure --host=crdb-1 2>/dev/null; then
            echo "cluster initialized"
            break
          fi
          if cockroach sql --insecure --host=crdb-1 -e 'SELECT 1' >/dev/null 2>&1; then
            echo "cluster already up"
            break
          fi
          sleep 1
        done
        cockroach sql --insecure --host=crdb-1 -e "CREATE DATABASE IF NOT EXISTS ti4601;"
    networks:
      - curso
    restart: "no"

  app-crdb:
    build: .
    image: ti4601:local
    profiles: ["lab1"]
    working_dir: /src
    environment:
      # Lista de hosts: cada operación abre una conexión nueva y puede continuar
      # aunque crdb-1 esté caído durante el escenario de failover.
      PGHOST: crdb-1,crdb-2,crdb-3
      PGPORT: "26257"
      PGUSER: root
      PGPASSWORD: ""
      PGDATABASE: ti4601
      PGSSLMODE: disable
      TI4601_ENGINE: cockroach
      # Compose interpola el .env de la raíz; nunca se versiona.
      COCKROACH_LICENSE: ${COCKROACH_LICENSE:-}
    volumes:
      - .:/src
    depends_on:
      crdb-init:
        condition: service_completed_successfully
    networks:
      - curso

  # ---------------------------------------------------------------------------
  # Laboratorio 3 — MongoDB: conjunto de réplicas de tres miembros.
  # Compose solo arranca los tres procesos con --replSet. NO ejecuta rs.initiate():
  # inicializar el conjunto es parte del trabajo del estudiante (Paso 2).
  # Sin autenticación ni TLS: entorno didáctico en una sola máquina.
  # ---------------------------------------------------------------------------
  mongo-1:
    image: mongo:8.0
    profiles: ["lab3"]
    container_name: ti4601-mongo-1
    hostname: mongo-1
    command: ["mongod", "--replSet", "rs-lab3", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - mongo1:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 3s
      timeout: 5s
      retries: 20
    networks:
      - curso

  mongo-2:
    image: mongo:8.0
    profiles: ["lab3"]
    container_name: ti4601-mongo-2
    hostname: mongo-2
    command: ["mongod", "--replSet", "rs-lab3", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - mongo2:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 3s
      timeout: 5s
      retries: 20
    networks:
      - curso

  mongo-3:
    image: mongo:8.0
    profiles: ["lab3"]
    container_name: ti4601-mongo-3
    hostname: mongo-3
    command: ["mongod", "--replSet", "rs-lab3", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - mongo3:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 3s
      timeout: 5s
      retries: 20
    networks:
      - curso

  app-mongo:
    build: .
    image: ti4601:local
    profiles: ["lab3"]
    working_dir: /src
    environment:
      # La URI lista los tres miembros: el driver descubre quién es el primario
      # y sigue funcionando si uno de ellos está caído.
      MONGO_URI: mongodb://mongo-1:27017,mongo-2:27017,mongo-3:27017/?replicaSet=rs-lab3
      MONGO_DB: boleteria
      TI4601_ENGINE: mongodb
    volumes:
      - .:/src
    depends_on:
      mongo-1:
        condition: service_healthy
      mongo-2:
        condition: service_healthy
      mongo-3:
        condition: service_healthy
    networks:
      - curso

  # ---------------------------------------------------------------------------
  # Laboratorio 4 — Neo4j Community, un nodo, y el notebook del laboratorio.
  # No es un conjunto de réplicas: el Laboratorio 3 ya midió mayoría y elección.
  # ---------------------------------------------------------------------------
  neo4j:
    image: neo4j:5.26-community
    profiles: ["lab4"]
    container_name: ti4601-neo4j
    hostname: neo4j
    environment:
      NEO4J_AUTH: neo4j/ti4601-grafos
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j4:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s
    networks:
      - curso

  lab4-notebook:
    build:
      context: ./labs/lab4-neo4j
      dockerfile: Dockerfile
    image: ti4601-lab4:local
    profiles: ["lab4"]
    container_name: ti4601-lab4
    working_dir: /src
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ti4601-grafos
      MODELO_ID: Qwen/Qwen2.5-0.5B-Instruct
      EMBED_MODEL: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      HF_HOME: /models/hf
      HUGGINGFACE_HUB_CACHE: /models/hf
      JUPYTER_TOKEN: ti4601
    command:
      - start-notebook.py
      - --ServerApp.root_dir=/src
      - --ServerApp.token=ti4601
      - --ServerApp.password=
      - --ServerApp.ip=0.0.0.0
      - --ServerApp.port=8888
    ports:
      - "127.0.0.1:8888:8888"
    volumes:
      - .:/src
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - curso

volumes:
  pgdata:
  crdb1:
  crdb2:
  crdb3:
  mongo1:
  mongo2:
  mongo3:
  neo4j4:

networks:
  curso:
    name: ti4601
